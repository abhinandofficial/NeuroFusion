<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Ablation study AUC chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">Ablation study: AUC-ROC by input set</text>
    <text x="30" y="62" font-size="13" fill="#64748b">Held-out ADNI test split (n = 92). Higher is better; 0.5 is chance.</text>
    <!-- grid -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="330" y1="85" x2="330" y2="335"/><line x1="455" y1="85" x2="455" y2="335"/>
      <line x1="580" y1="85" x2="580" y2="335"/><line x1="705" y1="85" x2="705" y2="335"/><line x1="830" y1="85" x2="830" y2="335"/>
    </g>
    <g font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="330" y="354">0</text><text x="455" y="354">0.25</text><text x="580" y="354">0.5</text><text x="705" y="354">0.75</text><text x="830" y="354">1.0</text>
    </g>
    <g font-size="14" fill="#334155" text-anchor="end">
      <text x="315" y="112">MRI only (binary)</text>
      <text x="315" y="162">MRI only (3-class)</text>
      <text x="315" y="212">MRI + age / sex / education</text>
      <text x="315" y="262">MRI + clinical scores (full model)</text>
      <text x="315" y="312">Clinical + demographics, no MRI</text>
    </g>
    <!-- bars: x0=330, 500px per 1.0 -->
    <rect x="330" y="92"  width="289" height="28" rx="6" fill="#f97316"/>
    <rect x="330" y="142" width="318" height="28" rx="6" fill="#f97316"/>
    <rect x="330" y="192" width="350" height="28" rx="6" fill="#3b82f6"/>
    <rect x="330" y="242" width="499" height="28" rx="6" fill="#10b981"/>
    <rect x="330" y="292" width="500" height="28" rx="6" fill="#10b981"/>
    <g font-size="13" font-weight="700" fill="#0f172a">
      <text x="627" y="111">0.578</text><text x="656" y="161">0.635</text><text x="688" y="211">0.699</text>
      <text x="770" y="261" fill="#ffffff">0.997</text><text x="778" y="311" fill="#ffffff">~1.0</text>
    </g>
  </g>
</svg>
