<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="NeuroFusion architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  </defs>
  <rect width="1100" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="38" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">IMAGE STREAM</text>
    <text x="30" y="228" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">CLINICAL STREAM</text>

    <!-- top row -->
    <rect x="30" y="55" width="200" height="86" rx="14" fill="url(#g1)" stroke="#93c5fd"/>
    <text x="130" y="91" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">T1 MRI volume</text>
    <text x="130" y="116" font-size="14" fill="#475569" text-anchor="middle">1 × 128 × 128 × 128</text>
    <line x1="232" y1="98" x2="288" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="290" y="55" width="240" height="86" rx="14" fill="url(#g1)" stroke="#93c5fd"/>
    <text x="410" y="91" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">MedicalNet 3D ResNet10</text>
    <text x="410" y="116" font-size="14" fill="#475569" text-anchor="middle">pretrained on medical imaging</text>
    <line x1="532" y1="98" x2="588" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="590" y="68" width="110" height="60" rx="30" fill="#2563eb"/>
    <text x="645" y="104" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">512-d</text>

    <!-- bottom row -->
    <rect x="30" y="245" width="200" height="86" rx="14" fill="url(#g2)" stroke="#6ee7b7"/>
    <text x="130" y="278" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Clinical inputs</text>
    <text x="130" y="300" font-size="12.5" fill="#475569" text-anchor="middle">MMSE · CDRSB · age</text>
    <text x="130" y="318" font-size="12.5" fill="#475569" text-anchor="middle">sex · education</text>
    <line x1="232" y1="288" x2="288" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="290" y="245" width="240" height="86" rx="14" fill="url(#g2)" stroke="#6ee7b7"/>
    <text x="410" y="281" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Clinical encoder</text>
    <text x="410" y="306" font-size="14" fill="#475569" text-anchor="middle">MLP · 5 → 32</text>
    <line x1="532" y1="288" x2="588" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="590" y="258" width="110" height="60" rx="30" fill="#059669"/>
    <text x="645" y="294" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">32-d</text>

    <!-- merge -->
    <path d="M702 98 C 740 98, 740 170, 770 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M702 288 C 740 288, 740 220, 770 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="772" y="150" width="130" height="100" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="837" y="190" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Concatenate</text>
    <text x="837" y="214" font-size="15" fill="#475569" text-anchor="middle">544-d</text>
    <line x1="904" y1="200" x2="938" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="940" y="140" width="135" height="120" rx="16" fill="url(#g3)"/>
    <text x="1007" y="184" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Classifier</text>
    <text x="1007" y="212" font-size="14" fill="#d1fae5" text-anchor="middle">CN vs Dementia</text>
    <text x="1007" y="234" font-size="14" fill="#d1fae5" text-anchor="middle">probability</text>
  </g>
</svg>
